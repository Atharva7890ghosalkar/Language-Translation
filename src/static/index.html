<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation | NLLB-200 Neural Engine</title>
    <!-- Google Fonts & Multi-Script Fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=7.0">
</head>
<body>
    <!-- Futuristic Beam Grid & Edge Network Background -->
    <div class="bg-scene" aria-hidden="true">
        <!-- Layer 2: Ambient Glow Orbs -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <!-- Layer 3 & 4: Perspective Beam Grid -->
        <div class="perspective-grid-container">
            <div class="perspective-grid-floor"></div>
            <div class="grid-horizon-glow"></div>
            <div class="travelling-beam-h"></div>
            <div class="travelling-beam-v"></div>
        </div>

        <!-- Layer 5 & 6: Sparse Edge Nodes & Thin Network Lines -->
        <div class="edge-network-container">
            <svg class="network-lines-svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                <line x1="8" y1="12" x2="18" y2="24" class="net-line" />
                <line x1="18" y1="24" x2="10" y2="40" class="net-line" />
                <line x1="10" y1="40" x2="15" y2="65" class="net-line" />
                <line x1="15" y1="65" x2="8" y2="85" class="net-line" />
                <line x1="92" y1="10" x2="84" y2="22" class="net-line" />
                <line x1="84" y1="22" x2="90" y2="42" class="net-line" />
                <line x1="90" y1="42" x2="85" y2="68" class="net-line" />
                <line x1="85" y1="68" x2="92" y2="88" class="net-line" />
                <line x1="18" y1="24" x2="26" y2="15" class="net-line alt" />
                <line x1="84" y1="22" x2="74" y2="14" class="net-line alt" />
            </svg>

            <div class="edge-node node-tl1"></div>
            <div class="edge-node node-tl2"></div>
            <div class="edge-node node-tr1"></div>
            <div class="edge-node node-tr2"></div>
            <div class="edge-node node-l1"></div>
            <div class="edge-node node-r1"></div>
            <div class="edge-node node-bl1"></div>
            <div class="edge-node node-br1"></div>
            <div class="edge-node node-bl2"></div>
            <div class="edge-node node-br2"></div>

            <div class="neural-spark spark-1"></div>
            <div class="neural-spark spark-2"></div>
            <div class="neural-spark spark-3"></div>
            <div class="neural-spark spark-4"></div>
        </div>

        <div class="grid-mesh-overlay"></div>
    </div>

    <!-- Main Centered Application Container -->
    <div class="app-container">
        <!-- Hero Section (Centered) -->
        <header class="hero-section" style="text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
            <h1 class="hero-title" style="text-align: center; margin-left: auto; margin-right: auto; width: 100%;">LANGUAGE TRANSLATION</h1>
            <!---<p class="hero-subtitle" style="text-align: center; margin-left: auto; margin-right: auto; width: 100%;">Neural Machine Translation</p>--->
        </header>

        <!-- Main Translation Workspace Card -->
        <main class="translation-card">
            <!-- Language Selection Controls Bar -->
            <section class="language-controls" aria-label="Language Selection">
                <!-- Source Language Custom Searchable Selector -->
                <div class="custom-select-container" id="sourceSelectContainer">
                    <label class="control-label" id="sourceSelectLabel">Source Language</label>
                    <div class="custom-select-wrapper">
                        <button 
                            type="button" 
                            id="sourceLangBtn" 
                            class="custom-select-trigger" 
                            aria-haspopup="listbox" 
                            aria-expanded="false"
                            aria-labelledby="sourceSelectLabel sourceLangBtn"
                        >
                            <span class="lang-icon" aria-hidden="true">🌐</span>
                            <span id="sourceLangSelectedText" class="selected-text">English</span>
                            <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>

                        <div id="sourceDropdown" class="custom-dropdown-panel hidden" role="dialog" aria-label="Select source language">
                            <div class="search-input-wrapper">
                                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input 
                                    type="text" 
                                    id="sourceSearchInput" 
                                    class="dropdown-search-input" 
                                    placeholder="Search language..." 
                                    autocomplete="off"
                                    aria-label="Search source language"
                                >
                            </div>
                            <ul id="sourceOptionsList" class="options-list" role="listbox" tabindex="-1">
                                <li class="loading-item">Loading languages...</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Swap Button -->
                <div class="swap-btn-container">
                    <button id="swapBtn" class="btn-swap" title="Swap Source and Target Languages" aria-label="Swap source and target languages">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
                        </svg>
                    </button>
                </div>

                <!-- Target Language Custom Searchable Selector -->
                <div class="custom-select-container" id="targetSelectContainer">
                    <label class="control-label" id="targetSelectLabel">Target Language</label>
                    <div class="custom-select-wrapper">
                        <button 
                            type="button" 
                            id="targetLangBtn" 
                            class="custom-select-trigger" 
                            aria-haspopup="listbox" 
                            aria-expanded="false"
                            aria-labelledby="targetSelectLabel targetLangBtn"
                        >
                            <span class="lang-icon" aria-hidden="true">🎯</span>
                            <span id="targetLangSelectedText" class="selected-text">French</span>
                            <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>

                        <div id="targetDropdown" class="custom-dropdown-panel hidden" role="dialog" aria-label="Select target language">
                            <div class="search-input-wrapper">
                                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input 
                                    type="text" 
                                    id="targetSearchInput" 
                                    class="dropdown-search-input" 
                                    placeholder="Search language..." 
                                    autocomplete="off"
                                    aria-label="Search target language"
                                >
                            </div>
                            <ul id="targetOptionsList" class="options-list" role="listbox" tabindex="-1">
                                <li class="loading-item">Loading languages...</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Text Panes Workspace -->
            <section class="text-panes" aria-label="Translation Workspace">
                <!-- Source Input Pane -->
                <div class="pane pane-input" id="sourcePane">
                    <div class="pane-header">
                        <span class="pane-title" id="sourceLangTitle">From: English</span>
                        <div class="pane-header-actions">
                            <span class="char-count" id="charCount" aria-live="polite">0 / 2000</span>
                            <button 
                                type="button" 
                                id="sourceExpandBtn" 
                                class="btn-action btn-expand" 
                                title="Expand editor" 
                                aria-label="Expand editor" 
                                aria-expanded="false"
                            >
                                <svg class="expand-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <polyline points="9 21 3 21 3 15"></polyline>
                                    <line x1="21" y1="3" x2="14" y2="10"></line>
                                    <line x1="3" y1="21" x2="10" y2="14"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="textarea-wrapper">
                        <textarea 
                            id="sourceText" 
                            class="text-area" 
                            placeholder="Enter or paste text to translate..."
                            maxlength="2000"
                            rows="9"
                            aria-label="Source text to translate"
                        ></textarea>
                    </div>
                </div>

                <!-- Target Output Pane -->
                <div class="pane pane-output" id="targetPane">
                    <div class="pane-header">
                        <span class="pane-title" id="targetLangTitle">To: French</span>
                        <div class="pane-header-actions">
                            <button id="copyBtn" class="btn-action" title="Copy Translation" aria-label="Copy translation to clipboard">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span id="copyText">Copy</span>
                            </button>

                            <button id="downloadBtn" class="btn-action" title="Download Translation" aria-label="Download translation as text file">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                <span id="downloadText">Download</span>
                            </button>

                            <button 
                                type="button" 
                                id="targetExpandBtn" 
                                class="btn-action btn-expand" 
                                title="Expand editor" 
                                aria-label="Expand editor" 
                                aria-expanded="false"
                            >
                                <svg class="expand-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <polyline points="9 21 3 21 3 15"></polyline>
                                    <line x1="21" y1="3" x2="14" y2="10"></line>
                                    <line x1="3" y1="21" x2="10" y2="14"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="textarea-wrapper">
                        <textarea 
                            id="targetText" 
                            class="text-area" 
                            readonly 
                            placeholder="Translation will appear here..."
                            rows="9"
                            aria-label="Translated output text"
                        ></textarea>
                        <!-- Loading Overlay -->
                        <div id="loadingOverlay" class="loading-overlay hidden" aria-live="assertive">
                            <div class="spinner" aria-hidden="true"></div>
                            <span class="loading-text">Translating with NLLB-200 on GPU...</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Alert / Toast Banner -->
            <div id="alertBanner" class="alert-banner hidden" role="alert" aria-live="polite"></div>

            <!-- Action Toolbar -->
            <footer class="action-bar">
                <button id="clearBtn" class="btn btn-secondary" type="button">
                    Clear Text
                </button>
                <button id="translateBtn" class="btn btn-primary" type="button">
                    <span id="translateBtnText">Translate</span>
                </button>
            </footer>
        </main>
    </div>

    <script src="/static/app.js?v=3.0"></script>
</body>
</html>
